services:
  web:
    build: .
    container_name: api-monitor-web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:4-management
    container_name: api-monitor-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"